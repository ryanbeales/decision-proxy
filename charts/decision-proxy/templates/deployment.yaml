apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-proxy.fullname" . }}
  labels:
    {{- include "decision-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "decision-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "decision-proxy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-proxy.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: UPSTREAM_ENDPOINT
              value: {{ .Values.upstream.endpoint | quote }}
            - name: UPSTREAM_MODEL
              value: {{ .Values.upstream.model | quote }}
            {{- if .Values.upstream.existingSecret }}
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upstream.existingSecret }}
                  key: {{ .Values.upstream.apiKeySecretKey | default "API_KEY" }}
            {{- else }}
            - name: UPSTREAM_API_KEY
              value: {{ .Values.upstream.apiKey | default "sk-no-key" | quote }}
            {{- end }}
            - name: DEFAULT_ENABLE_THINKING
              value: {{ .Values.thinking.defaultEnable | quote }}
            - name: DEFAULT_MAX_THINKING_TOKENS
              value: {{ .Values.thinking.defaultMaxTokens | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
